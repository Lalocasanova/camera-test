<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Camera Overlay Test</title>
    <style>
        /* Reset and force full screen */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* CAMERA LAYER: Sits at the very bottom */
        .camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* UI OVERLAY LAYER: Floats directly over the video */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none; /* Let clicks pass through empty spaces */
        }

        /* Force interactive elements to accept clicks/taps */
        .interactive {
            pointer-events: auto;
        }

        /* Top Bar styling */
        .top-bar {
            background: rgba(0, 0, 0, 0.65);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            backdrop-filter: blur(5px);
        }
        .sku-display {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #00ff88;
        }

        /* Form Fields styling */
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
        }
        input::placeholder {
            color: #ddd;
        }
        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            border-color: #00ff88;
        }

        /* Bottom Bar / Shutter styling */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-bottom: 20px;
        }
        .shutter-btn {
            width: 75px;
            height: 75px;
            background-color: #fff;
            border: 5px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .shutter-btn:active {
            transform: scale(0.92);
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <!-- Camera Layer -->
    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <!-- UI Overlay Layer -->
    <div class="ui-overlay">
        
        <!-- Top data collection panel -->
        <div class="top-bar interactive">
            <div class="sku-display" id="skuText">Active SKU: [Scan Pending]</div>
            <div class="input-group">
                <input type="text" id="widthInput" placeholder="Width (cm)">
                <input type="text" id="heightInput" placeholder="Height (cm)">
            </div>
        </div>

        <!-- Bottom shutter action panel -->
        <div class="bottom-bar">
            <button class="shutter-btn interactive" id="shutter" onclick="takePhoto()"></button>
        </div>

    </div>

    <script>
        const video = document.getElementById('webcam');

        // Request camera permission and stream immediately
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        // 'environment' forces the back camera on phones
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera: ", err);
                alert("Camera access denied or unavailable. Make sure you use HTTPS or open via Local Server.");
            }
        }

        function takePhoto() {
            // Flash effect or log confirmation for testing
            console.log("Photo action clicked!");
            alert("Shutter clicked! Next steps will handle saving this frame to your SKU.");
        }

        // Run camera startup on page load
        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
