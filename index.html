<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Camera Scanner Overlay</title>
    <!-- Include the HTML5-QRCode Library from a public CDN -->
    <script src="https://cloudflare.com" integrity="sha512-r6rDA7W6ZeQFrwt4Mmni7OtfHzwjv56VBlwC01wqQN5P50cHOUf68cJvY8w50ToyrpkE6MvJEIhgTulXqpqFFA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        /* Reset and force full screen */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* CAMERA LAYER: Sits at the very bottom */
        .camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Both elements must layer exactly on top of each other */
        video, #reader {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none !important;
        }
        /* Clean up html5-qrcode's default text/button styles to keep UI clean */
        #reader video {
            object-fit: cover !important;
        }

        /* UI OVERLAY LAYER: Floats directly over the video */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none; /* Let clicks pass through empty spaces */
        }

        /* Force interactive elements to accept clicks/taps */
        .interactive {
            pointer-events: auto;
        }

        /* Top Bar styling */
        .top-bar {
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .sku-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sku-label {
            font-size: 16px;
            font-weight: bold;
            color: #00ff88;
            white-space: nowrap;
        }
        
        .sku-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #00ff88;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }

        .scan-trigger-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .scan-trigger-btn.scanning {
            background: #ff3b30;
            color: #fff;
        }

        /* Form Fields styling */
        .input-group {
            display: flex;
            gap: 10px;
        }
        input.field {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
        }
        input::placeholder {
            color: #ddd;
        }
        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            border-color: #00ff88;
        }

        /* Bottom Bar / Shutter styling */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-bottom: 20px;
        }
        .shutter-btn {
            width: 75px;
            height: 75px;
            background-color: #fff;
            border: 5px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .shutter-btn:active {
            transform: scale(0.92);
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <!-- Camera Layer: Container for the scanner engine -->
    <div class="camera-container">
        <div id="reader"></div>
    </div>

    <!-- UI Overlay Layer -->
    <div class="ui-overlay">
        
        <!-- Top data collection panel -->
        <div class="top-bar interactive">
            <div class="sku-row">
                <span class="sku-label">Active SKU:</span>
                <input type="text" id="skuField" class="sku-input" placeholder="[Scan or Type]" readonly>
                <button id="scanBtn" class="scan-trigger-btn" onclick="toggleScanner()">Scan</button>
            </div>
            
            <div class="input-group">
                <input type="text" id="widthInput" class="field" placeholder="Width (cm)">
                <input type="text" id="heightInput" class="field" placeholder="Height (cm)">
            </div>
        </div>

        <!-- Bottom shutter action panel -->
        <div class="bottom-bar">
            <button class="shutter-btn interactive" id="shutter" onclick="takePhoto()"></button>
        </div>

    </div>

    <script>
        let html5QrCode;
        let isScanning = false;
        const skuField = document.getElementById('skuField');
        const scanBtn = document.getElementById('scanBtn');

        // Automatically start the continuous background camera stream on load
        function initBackgroundCamera() {
            html5QrCode = new Html5Qrcode("reader");
            // Start streaming immediately in view-only mode
            startScannerStream(false); 
        }

        function startScannerStream(enableDecoding) {
            const config = { 
                fps: 20, 
                qrbox: function(width, height) {
                    // Configures a wide rectangular scanning box ideal for standard 1D barcodes
                    return { width: width * 0.8, height: height * 0.3 };
                }
            };

            // Switch handling depending on whether we want to read barcodes or just show preview
            const onScanSuccess = enableDecoding ? (decodedText) => {
                skuField.value = decodedText; // Dump barcode value directly into the text field
                vibratePhone();
                stopScanner(); // Stop analyzing frames once code is captured
            } : null;

            html5QrCode.start(
                { facingMode: "environment" }, // Target the rear lens
                config,
                onScanSuccess,
                (errorMessage) => {
                    // Suppress continuous engine frame errors to avoid console clogging
                }
            ).catch((err) => {
                console.error("Camera startup failed: ", err);
            });
        }

        function toggleScanner() {
            if (!isScanning) {
                // Turn on decoding engine
                isScanning = true;
                scanBtn.innerText = "Stop";
                scanBtn.classList.add('scanning');
                html5QrCode.stop().then(() => {
                    startScannerStream(true); // Restart camera with decoder callback active
                });
            } else {
                stopScanner();
            }
        }

        function stopScanner() {
            isScanning = false;
            scanBtn.innerText = "Scan";
            scanBtn.classList.remove('scanning');
            html5QrCode.stop().then(() => {
                startScannerStream(false); // Drop back down to passive camera viewing layer
            });
        }

        function vibratePhone() {
            if (navigator.vibrate) {
                navigator.vibrate(100); // 100ms haptic feedback bump on code clear
            }
        }

        function takePhoto() {
            const activeSku = skuField.value || "No_SKU";
            alert(`Shutter clicked! Ready to export picture named as: ${activeSku}_timestamp.jpg`);
        }

        // Initialize engine hooks when file paints onto screen
        window.addEventListener('DOMContentLoaded', initBackgroundCamera);
    </script>
</body>
</html>
